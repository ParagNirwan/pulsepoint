<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <a [href]="url" target="_blank">
        {{ title }}
      </a>
    </mat-card-title>

    <mat-card-subtitle
      ><i
        ><b>{{ source }}</b></i
      ></mat-card-subtitle
    >
  </mat-card-header>

  <mat-card-actions>
    <button mat-button (click)="openArticle()">
      <span class="material-icons">open_in_new</span>
    </button>

    <button mat-button>
      <span class="material-icons">share</span>
    </button>

    <button mat-button (click)="toggleSave()">
      <span class="material-icons">
        {{ saved ? 'bookmark' : 'bookmark_border' }}
      </span>
    </button>
  </mat-card-actions>
</mat-card>

<br />
