<mat-card class="news-card" appearance="outlined" *ngIf="article">
  <mat-card-header>
    <mat-card-title>{{ article.title }}</mat-card-title>

    <mat-card-subtitle>
      <hr />
      {{ article.source.name }} |
      {{ article.publishedAt | date : 'mediumDate' }}

      <hr
    /></mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    [src]="
      article.urlToImage ||
      'https://upload.wikimedia.org/wikipedia/commons/d/d1/Image_not_available.png'
    "
    [alt]="article.title"
  />

  <mat-card-content>
    <p>{{ article.description || 'No description available' }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button (click)="openArticle()">
      <span class="material-icons">open_in_new</span>
    </button>

    <button mat-button (click)="liked = !liked">
      <span class="material-icons">
        {{ liked ? 'favorite' : 'favorite_border' }}
      </span>
    </button>

    <button mat-button>
      <span class="material-icons">share</span>
    </button>

    <button mat-button (click)="toggleSave()">
      <span class="material-icons">
        {{ saved ? 'bookmark' : 'bookmark_border' }}
      </span>
    </button>

    <button mat-button (click)="dislike()">
      <span class="material-icons">visibility_off</span>
    </button>
  </mat-card-actions>
</mat-card>
